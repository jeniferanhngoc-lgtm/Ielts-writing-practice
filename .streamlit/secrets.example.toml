# Mẫu Google Sheets: điền trong Streamlit Cloud → Settings → Secrets.
# Máy cá nhân: sao chép thành secrets.toml. KHÔNG commit secrets.toml.
storage_mode = "sheets"
spreadsheet_id = "ID_GOOGLE_SHEET"

[gcp_service_account]
type = "service_account"
project_id = "your-project"
private_key_id = "COPY_FROM_JSON"
private_key = "-----BEGIN PRIVATE KEY-----\nCOPY_FROM_JSON\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-project.iam.gserviceaccount.com"
client_id = "COPY_FROM_JSON"
token_uri = "https://oauth2.googleapis.com/token"
